services:
  - type: web
    name: everlocker-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_DB
        value: EverLocker
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAILJS_SERVICE_ID
        value: service_omtbyhk
      - key: EMAILJS_TEMPLATE_ID
        value: template_zun3nmp
      - key: EMAILJS_PUBLIC_KEY
        sync: false

