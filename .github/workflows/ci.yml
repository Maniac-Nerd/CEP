name: Validate project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Codebase Syntax & Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend syntax
        run: |
          node --check backend/server.js
          node --check backend/create-admin.js
          node --check backend/mail.js

      - name: Check frontend app syntax
        run: node --check frontend/app.js

      - name: Check admin HTML script syntax
        run: node -e "const fs = require('fs'); const html = fs.readFileSync('frontend/admin.html', 'utf8'); const script = html.match(/<script>([\s\S]*?)<\/script>/)[1]; new Function(script);"
